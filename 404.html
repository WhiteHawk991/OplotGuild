<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перенаправление</title>
    <base href="/OplotGuild/" />
    <script>
        // Перенаправляем на главную страницу с сохранением пути
        var path = window.location.pathname.replace('/OplotGuild', '');
        sessionStorage.setItem('redirect', path);
        window.location.href = '/OplotGuild/';
    </script>
</head>
<body>
    <p>Перенаправление на главную...</p>
    <a href="/OplotGuild/">Нажмите здесь</a>
</body>
</html>

<!-- Компонент "Анимированные волны" -->
<div class="wave-container">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
</div>

<style>
/* Базовые стили волн */
.wave-container {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 120px;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
}
.wave {
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 200%;
    height: 100%;
    background: repeating-linear-gradient(90deg, 
        rgba(201, 168, 76, 0.08) 0%, 
        rgba(201, 168, 76, 0.03) 15%, 
        rgba(201, 168, 76, 0.08) 30%);
    border-radius: 50% 50% 0 0;
    animation: waveMove linear infinite;
}
.wave1 {
    animation-duration: 7s;
    opacity: 0.6;
    background: repeating-linear-gradient(90deg, 
        rgba(201, 168, 76, 0.12) 0%, 
        transparent 20%, 
        rgba(201, 168, 76, 0.12) 40%);
}
.wave2 {
    animation-duration: 11s;
    opacity: 0.4;
    animation-delay: -2s;
    background: repeating-linear-gradient(90deg, 
        rgba(201, 168, 76, 0.08) 0%, 
        transparent 25%, 
        rgba(201, 168, 76, 0.08) 50%);
}
.wave3 {
    animation-duration: 15s;
    opacity: 0.3;
    animation-delay: -5s;
    background: repeating-linear-gradient(90deg, 
        rgba(201, 168, 76, 0.05) 0%, 
        transparent 30%, 
        rgba(201, 168, 76, 0.05) 60%);
}
@keyframes waveMove {
    0% { transform: translateX(0) scaleY(0.3); }
    50% { transform: translateX(-50%) scaleY(0.7); }
    100% { transform: translateX(-100%) scaleY(0.3); }
}
/* Адаптация для мобильных */
@media (max-width: 600px) {
    .wave-container {
        height: 80px;
    }
}
</style>

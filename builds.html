<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Билды кораблей — ОПЛОТ</title>
    <base href="/OplotGuild/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 0;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .lock-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .message-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 10px;
            border: 1px solid #c9a84c;
            margin-bottom: 20px;
        }
        .message-box h2 {
            color: #c9a84c;
        }
        .form-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #c9a84c;
            max-width: 500px;
            margin: 20px auto;
            text-align: left;
        }
        .form-box label {
            display: block;
            margin-bottom: 5px;
            color: #c9a84c;
        }
        .form-box input[type="text"],
        .form-box input[type="url"],
        .form-box input[type="file"],
        .form-box textarea,
        .form-box select {
            width: 100%;
            padding: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid #c9a84c;
            border-radius: 5px;
            margin-bottom: 15px;
            font-family: inherit;
        }
        .form-box textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-box select option {
            background: var(--bg-primary);
        }
        .btn-submit {
            background: #c9a84c;
            color: #1a1a2e;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            width: 100%;
        }
        .btn-submit:hover {
            background: #e0d6b0;
            transform: scale(1.02);
        }
        .btn-logout {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background: transparent;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            cursor: pointer;
        }
        .btn-logout:hover {
            background: #ff6b6b;
            color: #0a0a15;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
        }
        .message.success {
            background: #2d6a4f;
            color: #d8f3dc;
        }
        .message.error {
            background: #6a1e1e;
            color: #ffcccc;
        }
        .toggle-form-btn {
            background: transparent;
            color: #c9a84c;
            border: 1px solid #c9a84c;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            margin-top: 10px;
        }
        .toggle-form-btn:hover {
            background: #c9a84c;
            color: #0a0a15;
        }
        .hidden {
            display: none;
        }
        #filePreview {
            margin-top: 10px;
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            border: 1px solid #c9a84c;
            display: none;
        }
        .empty-message {
            color: var(--text-muted);
            padding: 20px;
        }

        /* Стили для плиточной сетки */
        .ship-group {
            margin-bottom: 30px;
            text-align: left;
        }
        .ship-group h3 {
            color: #c9a84c;
            font-size: 1.8rem;
            border-bottom: 2px solid #c9a84c;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ship-group h3 .ship-type {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: normal;
        }
        .builds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .build-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #c9a84c;
            text-align: left;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .build-card:hover {
            border-color: #e0d6b0;
            transform: translateY(-3px);
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        .build-card img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #2a2a3e;
            background: var(--bg-primary);
        }
        .build-card .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #c9a84c;
            margin: 5px 0;
        }
        .build-card .card-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 8px;
        }
        .build-card .card-label span {
            color: var(--text-primary);
        }
        .build-card .card-author {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 10px;
            border-top: 1px solid #2a2a3e;
            padding-top: 8px;
        }
        .build-card .card-description {
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 8px 0;
            color: var(--text-secondary);
            flex-grow: 1;
        }
        .build-card .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .build-card .card-tags .tag {
            background: rgba(201, 168, 76, 0.15);
            color: #c9a84c;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid rgba(201, 168, 76, 0.2);
        }
        .build-card .share-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 5px 10px;
            border-radius: 5px;
            transition: 0.3s;
            margin-top: 8px;
            align-self: flex-start;
        }
        .build-card .share-btn:hover {
            color: #c9a84c;
            background: rgba(201, 168, 76, 0.1);
        }
        .build-card .like-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }
        .build-card .like-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 5px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .build-card .like-btn:hover {
            background: rgba(201, 168, 76, 0.1);
        }
        .build-card .like-btn.liked {
            color: #ff4757;
        }
        .build-card .like-count {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .search-box {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .search-box input {
            padding: 10px 15px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid #c9a84c;
            border-radius: 30px;
            font-size: 1rem;
            flex: 1;
            min-width: 200px;
            max-width: 400px;
        }
        .search-box input:focus {
            outline: none;
            border-color: #e0d6b0;
        }
        .search-box select {
            padding: 10px 15px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid #c9a84c;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
        }
        .search-box select:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <div id="content-protected" style="display: none;">
            <div class="message-box">
                <div class="lock-icon">⚓</div>
                <h2>Билды кораблей</h2>
                <p>Лучшие билды наших капитанов</p>
                
                <button onclick="toggleForm()" class="toggle-form-btn">➕ Предложить свой билд</button>
                
                <!-- Форма добавления билда -->
                <div id="buildForm" class="hidden">
                    <div class="form-box">
                        <h3 style="color: #c9a84c; text-align: center; margin-top: 0;">Новый билд</h3>
                        <form id="buildSubmissionForm" onsubmit="submitBuild(event)" enctype="multipart/form-data">
                            <label for="shipName">Название корабля</label>
                            <input type="text" id="shipName" required placeholder="Например: Святой Пётр" />
                            
                            <label for="shipType">Тип корабля</label>
                            <select id="shipType" required>
                                <option value="">Выберите тип</option>
                                <option value="Торговый">Торговый</option>
                                <option value="Быстроходный">Быстроходный</option>
                                <option value="Боевой">Боевой</option>
                                <option value="Имперский">Имперский</option>
                                <option value="Тяжелый">Тяжелый</option>
                                <option value="Осадный">Осадный</option>
                            </select>
                            
                            <label for="armament">⚔️ Вооружение (пушки)</label>
                            <textarea id="armament" placeholder="Какие пушки установлены? Например: 42-фунтовые карронады"></textarea>
                            
                            <label for="upgrades">Апгрейды</label>
                            <textarea id="upgrades" placeholder="Перечислите установленные апгрейды"></textarea>
                            
                            <label for="description">Почему этот билд крут?</label>
                            <textarea id="description" required placeholder="Краткое описание тактики"></textarea>
                            
                            <label for="imageFile">🖼️ Загрузить скриншот (до 10 МБ)</label>
                            <input type="file" id="imageFile" accept="image/*" onchange="previewFile(event)" />
                            <img id="filePreview" alt="Предпросмотр" />
                            
                            <label for="imageUrl">Или вставьте ссылку на картинку (необязательно)</label>
                            <input type="url" id="imageUrl" placeholder="Ссылка на Imgur, PostImages и т.д." />
                            
                            <label for="author">Ваш ник в WOSB</label>
                            <input type="text" id="author" required placeholder="Ваш игровой ник" />
                            
                            <button type="submit" class="btn-submit">🚀 Отправить билд</button>
                        </form>
                        <div id="buildMessage" class="message" style="display: none;"></div>
                    </div>
                </div>
                
                <!-- Поиск и фильтр -->
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Поиск по билдам..." oninput="filterBuilds()" />
                    <select id="typeFilter" onchange="filterBuilds()">
                        <option value="">Все типы</option>
                        <option value="Торговый">Торговый</option>
                        <option value="Быстроходный">Быстроходный</option>
                        <option value="Боевой">Боевой</option>
                        <option value="Имперский">Имперский</option>
                        <option value="Тяжелый">Тяжелый</option>
                        <option value="Осадный">Осадный</option>
                    </select>
                </div>
                
                <div id="buildsContainer">
                    <div class="empty-message">⏳ Загрузка билдов...</div>
                </div>
                
                <button onclick="logout()" class="btn-logout">🚪 Выйти (забыть пароль)</button>
            </div>
        </div>

        <div id="password-form">
            <div class="message-box">
                <div class="lock-icon">🔒</div>
                <h2>Доступ к билдам</h2>
                <p>Этот раздел доступен только членам гильдии.</p>
                <div class="form-box">
                    <form id="passwordForm" onsubmit="checkPassword(event)">
                        <input type="password" id="passwordInput" placeholder="Введите пароль" required />
                        <button type="submit" class="btn-submit">Войти</button>
                    </form>
                    <div id="passwordMessage" class="message" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        // ==================== НАСТРОЙКИ ====================
        const CORRECT_PASSWORD = "oplot2026";
        const STORAGE_KEY = "oplot_builds_authorized";
        const WEBHOOK_URL = "https://lolka.app/api/webhooks/819395686533120/ODE5Mzk1Njg2NTMzMTIw.5QpOxqPbAtxe3mR3waM98b3SgSoXof2AmF-PeSycKwI";
        // =================================================

        var allBuilds = [];

        // Функция для работы с лайками
        function toggleLike(buildId) {
            var likedBuilds = JSON.parse(localStorage.getItem('likedBuilds') || '[]');
            var index = likedBuilds.indexOf(buildId);
            var build = allBuilds.find(b => b.id === buildId);
            if (!build) return;

            if (index === -1) {
                build.likes = (build.likes || 0) + 1;
                likedBuilds.push(buildId);
            } else {
                build.likes = Math.max(0, (build.likes || 0) - 1);
                likedBuilds.splice(index, 1);
            }

            localStorage.setItem('likedBuilds', JSON.stringify(likedBuilds));
            renderBuilds(allBuilds);
        }

        // Проверка, лайкнул ли пользователь билд
        function isLiked(buildId) {
            var likedBuilds = JSON.parse(localStorage.getItem('likedBuilds') || '[]');
            return likedBuilds.includes(buildId);
        }

        window.onload = function() {
            if (localStorage.getItem(STORAGE_KEY) === 'true') {
                showContent();
                loadBuilds();
            }
        };

        function checkPassword(event) {
            event.preventDefault();
            var input = document.getElementById('passwordInput').value;
            var messageDiv = document.getElementById('passwordMessage');

            if (input === CORRECT_PASSWORD) {
                localStorage.setItem(STORAGE_KEY, 'true');
                showContent();
                loadBuilds();
            } else {
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Неверный пароль. Попробуйте снова.';
            }
        }

        function showContent() {
            document.getElementById('password-form').style.display = 'none';
            document.getElementById('content-protected').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }

        function toggleForm() {
            var form = document.getElementById('buildForm');
            form.classList.toggle('hidden');
        }

        function previewFile(event) {
            var preview = document.getElementById('filePreview');
            var file = event.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                preview.src = '';
                preview.style.display = 'none';
            }
        }

        // ==================== ЗАГРУЗКА БИЛДОВ ====================
        function loadBuilds() {
            var container = document.getElementById('buildsContainer');
            container.innerHTML = '<div class="empty-message">⏳ Загрузка билдов...</div>';

            fetch('builds.json?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Файл builds.json не найден');
                    }
                    return response.json();
                })
                .then(data => {
                    allBuilds = data.builds || [];
                    renderBuilds(allBuilds);
                })
                .catch(error => {
                    console.error('Ошибка загрузки билдов:', error);
                    container.innerHTML = '<div class="empty-message">⚠️ Не удалось загрузить билды. Проверьте наличие файла builds.json.</div>';
                });
        }

        function renderBuilds(builds) {
            var container = document.getElementById('buildsContainer');
            container.innerHTML = '';

            if (!builds || builds.length === 0) {
                container.innerHTML = '<div class="empty-message">📭 Нет билдов, соответствующих фильтру.</div>';
                return;
            }

            // Группировка по кораблям
            var groups = {};
            builds.forEach(function(build) {
                var key = build.shipName;
                if (!groups[key]) {
                    groups[key] = [];
                }
                groups[key].push(build);
            });

            var sortedShipNames = Object.keys(groups).sort();

            sortedShipNames.forEach(function(shipName) {
                var buildsInGroup = groups[shipName];
                var groupDiv = document.createElement('div');
                groupDiv.className = 'ship-group';

                var firstBuild = buildsInGroup[0];
                var typeLabel = firstBuild.shipType ? ` (${firstBuild.shipType})` : '';
                var header = document.createElement('h3');
                header.innerHTML = `⚓ ${shipName} <span class="ship-type">${typeLabel} · ${buildsInGroup.length} билд${buildsInGroup.length > 1 ? 'а' : ''}</span>`;
                groupDiv.appendChild(header);

                var grid = document.createElement('div');
                grid.className = 'builds-grid';

                buildsInGroup.forEach(function(build) {
                    var card = document.createElement('div');
                    card.className = 'build-card';
                    
                    var imageHtml = build.imageUrl ? `<img src="${build.imageUrl}" alt="${build.shipName}" loading="lazy" />` : '';
                    var armamentHtml = build.armament ? `<div class="card-label">⚔️ Вооружение: <span>${build.armament}</span></div>` : '';
                    var upgradesHtml = build.upgrades ? `<div class="card-label">🔧 Апгрейды: <span>${build.upgrades}</span></div>` : '';
                    
                    var tagsHtml = '';
                    if (build.shipType) {
                        tagsHtml += `<span class="tag">${build.shipType}</span>`;
                    }
                    if (build.armament && build.armament.toLowerCase().includes('дальнобойные')) {
                        tagsHtml += `<span class="tag">🎯 Дальний бой</span>`;
                    }

                    var liked = isLiked(build.id);
                    
                    card.innerHTML = `
                        ${imageHtml}
                        <div class="card-title">${build.shipName}</div>
                        ${armamentHtml}
                        ${upgradesHtml}
                        <div class="card-description">${build.description}</div>
                        ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
                        <div class="card-author">✍️ ${build.author}</div>
                        <div class="like-section">
                            <button class="like-btn ${liked ? 'liked' : ''}" onclick="toggleLike(${build.id})">
                                ${liked ? '❤️' : '🤍'} <span class="like-count">${build.likes || 0}</span>
                            </button>
                            <button class="share-btn" onclick="shareBuild('${build.shipName}', '${build.description}', '${build.author}')">🔗 Поделиться</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                groupDiv.appendChild(grid);
                container.appendChild(groupDiv);
            });
        }

        // ==================== ПОИСК И ФИЛЬТРАЦИЯ ====================
        function filterBuilds() {
            var searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            var typeFilter = document.getElementById('typeFilter').value;

            var filtered = allBuilds.filter(function(build) {
                var matchSearch = true;
                var matchType = true;

                if (searchTerm) {
                    matchSearch = build.shipName.toLowerCase().includes(searchTerm) ||
                                  build.description.toLowerCase().includes(searchTerm) ||
                                  build.author.toLowerCase().includes(searchTerm) ||
                                  (build.armament && build.armament.toLowerCase().includes(searchTerm)) ||
                                  (build.upgrades && build.upgrades.toLowerCase().includes(searchTerm));
                }

                if (typeFilter) {
                    matchType = build.shipType === typeFilter;
                }

                return matchSearch && matchType;
            });

            renderBuilds(filtered);
        }

        // ==================== КНОПКА "ПОДЕЛИТЬСЯ" ====================
        function shareBuild(shipName, description, author) {
            var url = window.location.href;
            var text = `⚓ ${shipName}\n📝 ${description}\n✍️ ${author}\n\nПодробнее: ${url}`;
            
            navigator.clipboard.writeText(text).then(function() {
                alert('✅ Ссылка на билд скопирована в буфер обмена!');
            }).catch(function() {
                prompt('Скопируйте ссылку:', text);
            });
        }

        // ==================== ОТПРАВКА БИЛДА ====================
        function submitBuild(event) {
            event.preventDefault();

            var shipName = document.getElementById('shipName').value.trim();
            var shipType = document.getElementById('shipType').value;
            var armament = document.getElementById('armament').value.trim();
            var upgrades = document.getElementById('upgrades').value.trim();
            var description = document.getElementById('description').value.trim();
            var imageUrl = document.getElementById('imageUrl').value.trim();
            var author = document.getElementById('author').value.trim();
            var fileInput = document.getElementById('imageFile');
            var file = fileInput.files[0];
            var messageDiv = document.getElementById('buildMessage');

            if (!shipName || !shipType || !description || !author) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Заполните все обязательные поля!';
                return;
            }

            if (file && file.size > 10 * 1024 * 1024) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Файл слишком большой! Максимальный размер — 10 МБ.';
                return;
            }

            var formData = new FormData();
            var content = `**📝 Предложен новый билд!**\n\n**Корабль:** ${shipName}\n**Тип:** ${shipType}\n**Автор:** ${author}\n**Вооружение:** ${armament || 'Не указано'}\n**Апгрейды:** ${upgrades || 'Не указаны'}\n**Описание:** ${description}`;
            formData.append('content', content);

            if (imageUrl) {
                var embed = {
                    title: "⚓ " + shipName,
                    color: 0xc9a84c,
                    fields: [
                        { name: "Тип", value: shipType, inline: true },
                        { name: "Автор", value: author, inline: true },
                        { name: "Вооружение", value: armament || "Не указано", inline: false },
                        { name: "Апгрейды", value: upgrades || "Не указаны", inline: false },
                        { name: "Описание", value: description, inline: false }
                    ],
                    image: { url: imageUrl },
                    timestamp: new Date().toISOString()
                };
                formData.append('embeds', JSON.stringify([embed]));
            }

            if (file) {
                formData.append('files[0]', file);
            }

            fetch(WEBHOOK_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    messageDiv.style.display = 'block';
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '✅ Билд успешно отправлен! Спасибо за вклад в развитие гильдии.';
                    document.getElementById('buildSubmissionForm').reset();
                    document.getElementById('filePreview').style.display = 'none';
                    setTimeout(() => {
                        document.getElementById('buildForm').classList.add('hidden');
                    }, 3000);
                } else {
                    return response.text().then(text => {
                        throw new Error(`Ошибка ${response.status}: ${text}`);
                    });
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Не удалось отправить билд. Попробуйте позже.';
            });
        }
    </script>
</body>
</html>

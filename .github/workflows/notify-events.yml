name: Уведомления о событиях

on:
  schedule:
    - cron: '*/5 * * * *'  # Каждые 5 минут
  workflow_dispatch:

jobs:
  check-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Проверка и отправка
        env:
          WEBHOOK_URL: ${{ secrets.EVENT_WEBHOOK_URL }}
        run: |
          EVENTS=$(cat events.json)
          NOW=$(date -d "3 hours" +"%Y-%m-%dT%H:%M:00")
          
          echo "$EVENTS" | jq -c '.events[]' | while read event; do
            ID=$(echo "$event" | jq -r '.id')
            DATETIME=$(echo "$event" | jq -r '.datetime')
            NOTIFIED=$(echo "$event" | jq -r '.notified')
            TITLE=$(echo "$event" | jq -r '.title')
            DESCRIPTION=$(echo "$event" | jq -r '.description')
            REPEAT_INTERVAL=$(echo "$event" | jq -r '.repeatInterval')
            
            if [[ "$NOTIFIED" == "false" ]]; then
              ONE_HOUR_BEFORE=$(date -d "$DATETIME - 1 hour" +"%Y-%m-%dT%H:%M:00")
              
              if [[ "$NOW" >= "$ONE_HOUR_BEFORE" ]]; then
                MESSAGE="**⏰ Напоминание о событии!**\n\n**📌 $TITLE**\n**📅 Начало:** $(date -d "$DATETIME" +"%d.%m.%Y в %H:%M") МСК\n**📝 Описание:** ${DESCRIPTION:-Нет}"
                
                curl -X POST "$WEBHOOK_URL" \
                  -H "Content-Type: application/json" \
                  -d "{\"content\":\"$MESSAGE\"}"
                
                # Помечаем как уведомлённое
                # Здесь нужно обновить JSON через API, но это пока оставим
                echo "✅ Уведомление отправлено для события: $TITLE"
              fi
            fi
          done

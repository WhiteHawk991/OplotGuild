<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Музыка гильдии — ОПЛОТ</title>
    <base href="/OplotGuild/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 0;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px 100px 20px;
            text-align: center;
        }
        h1 {
            color: #c9a84c;
            border-bottom: 2px solid #c9a84c;
            padding-bottom: 10px;
            display: inline-block;
        }
        /* Стили для альбомов */
        .album-group {
            margin-bottom: 40px;
            text-align: left;
        }
        .album-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: var(--card-bg);
            border-radius: 10px;
            border-left: 4px solid #c9a84c;
        }
        .album-header img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(201, 168, 76, 0.3);
        }
        .album-header .info .name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #c9a84c;
        }
        .album-header .info .count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .songs-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            padding-left: 20px;
        }
        .song-item {
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(201, 168, 76, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
            cursor: pointer;
        }
        .song-item:hover {
            border-color: #c9a84c;
            background: rgba(201, 168, 76, 0.05);
        }
        .song-item .info {
            display: flex;
            flex-direction: column;
        }
        .song-item .info .title {
            font-weight: bold;
            color: var(--text-primary);
        }
        .song-item .info .desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .song-item .play-btn {
            background: #c9a84c;
            color: #1a1a2e;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .song-item .play-btn:hover {
            background: #e0d6b0;
            transform: scale(1.1);
        }
        .song-item .play-btn.playing {
            background: #ff6b6b;
            color: white;
        }
        .empty-message {
            color: var(--text-muted);
            padding: 30px;
        }

        /* ===== ФИКСИРОВАННЫЙ ПЛЕЕР В НИЖНЕМ УГЛУ ===== */
        #floating-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: var(--card-bg);
            border: 1px solid #c9a84c;
            border-radius: 15px;
            padding: 12px 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            width: 280px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #floating-player .fp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        #floating-player .fp-header .fp-title {
            font-weight: bold;
            color: #c9a84c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        #floating-player .fp-header .fp-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
        }
        #floating-player .fp-header .fp-close:hover {
            color: #ff6b6b;
        }
        #floating-player audio {
            width: 100%;
            height: 32px;
            border-radius: 8px;
        }
        #floating-player .fp-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 4px;
        }
        #floating-player .fp-controls button {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            padding: 4px 10px;
            border-radius: 5px;
        }
        #floating-player .fp-controls button:hover {
            background: rgba(201, 168, 76, 0.15);
            color: #c9a84c;
        }
        #floating-player .fp-controls .fp-playing-now {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        @media (max-width: 600px) {
            #floating-player {
                width: 220px;
                padding: 10px 14px;
                bottom: 10px;
                right: 10px;
            }
            #floating-player .fp-header .fp-title {
                max-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <h1>🎵 Музыка гильдии</h1>
        <p style="color: var(--text-secondary); margin-top: 10px;">Альбомы и песни для поднятия духа</p>

        <div id="songsContainer">
            <div class="empty-message">⏳ Загрузка музыки...</div>
        </div>
    </div>

    <!-- ФИКСИРОВАННЫЙ ПЛЕЕР -->
    <div id="floating-player" style="display: none;">
        <div class="fp-header">
            <span class="fp-title" id="fp-title">Название</span>
            <button class="fp-close" id="fp-close" title="Закрыть плеер">✕</button>
        </div>
        <audio id="fp-audio" controls>
            <source src="" type="audio/mpeg">
        </audio>
        <div class="fp-controls">
            <button id="fp-play-pause">⏸️</button>
            <button id="fp-stop">⏹️</button>
            <span class="fp-playing-now" id="fp-now">Сейчас играет</span>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>
        // ====================================================
        // 1. ДАННЫЕ (вынесены для простоты)
        // ====================================================
        // Для реального использования данные загружаются из music.json
        // Но я покажу структуру, как они должны выглядеть
        // ====================================================

        // ====================================================
        // 2. ПЛЕЕР
        // ====================================================
        var fp = {
            audio: document.getElementById('fp-audio'),
            title: document.getElementById('fp-title'),
            now: document.getElementById('fp-now'),
            playPauseBtn: document.getElementById('fp-play-pause'),
            stopBtn: document.getElementById('fp-stop'),
            closeBtn: document.getElementById('fp-close'),
            container: document.getElementById('floating-player'),
            currentSong: null,
            isPlaying: false
        };

        // Функция открытия плеера
        function openPlayer(song) {
            fp.currentSong = song;
            fp.audio.src = song.file;
            fp.title.textContent = song.title;
            fp.now.textContent = '▶ ' + song.title;
            fp.container.style.display = 'flex';
            fp.audio.load();
            fp.audio.play().catch(() => {});
            fp.isPlaying = true;
            fp.playPauseBtn.textContent = '⏸️';
            // Сохраняем в localStorage, чтобы плеер не сбрасывался при перезагрузке
            try {
                localStorage.setItem('oplot_player', JSON.stringify({
                    song: song,
                    time: 0
                }));
            } catch(e) {}
        }

        // Воспроизведение/пауза
        fp.playPauseBtn.addEventListener('click', function() {
            if (fp.isPlaying) {
                fp.audio.pause();
                fp.isPlaying = false;
                fp.playPauseBtn.textContent = '▶️';
            } else {
                fp.audio.play().catch(() => {});
                fp.isPlaying = true;
                fp.playPauseBtn.textContent = '⏸️';
            }
        });

        // Остановка
        fp.stopBtn.addEventListener('click', function() {
            fp.audio.pause();
            fp.audio.currentTime = 0;
            fp.isPlaying = false;
            fp.playPauseBtn.textContent = '▶️';
        });

        // Закрыть плеер
        fp.closeBtn.addEventListener('click', function() {
            fp.audio.pause();
            fp.container.style.display = 'none';
            fp.isPlaying = false;
            fp.playPauseBtn.textContent = '▶️';
            try {
                localStorage.removeItem('oplot_player');
            } catch(e) {}
        });

        // Обновление статуса при окончании трека
        fp.audio.addEventListener('ended', function() {
            fp.isPlaying = false;
            fp.playPauseBtn.textContent = '▶️';
            fp.now.textContent = '⏹ Остановлено';
        });

        // Обновление времени в localStorage
        fp.audio.addEventListener('timeupdate', function() {
            try {
                var data = JSON.parse(localStorage.getItem('oplot_player') || '{}');
                if (data.song && data.song.file === fp.audio.src) {
                    data.time = fp.audio.currentTime;
                    localStorage.setItem('oplot_player', JSON.stringify(data));
                }
            } catch(e) {}
        });

        // ====================================================
        // 3. ЗАГРУЗКА И ОТОБРАЖЕНИЕ АЛЬБОМОВ
        // ====================================================
        function loadMusic() {
            var container = document.getElementById('songsContainer');
            container.innerHTML = '<div class="empty-message">⏳ Загрузка музыки...</div>';

            // Загружаем из music.json
            fetch('music.json?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) throw new Error('music.json не найден');
                    return response.json();
                })
                .then(data => {
                    container.innerHTML = '';
                    if (!data.albums || data.albums.length === 0) {
                        container.innerHTML = '<div class="empty-message">📭 Нет альбомов. Добавьте их в music.json.</div>';
                        return;
                    }

                    // Сортируем альбомы по году (если есть)
                    data.albums.sort((a, b) => (a.year || 0) - (b.year || 0));

                    data.albums.forEach(function(album) {
                        var groupDiv = document.createElement('div');
                        groupDiv.className = 'album-group';

                        // Заголовок альбома
                        var header = document.createElement('div');
                        header.className = 'album-header';
                        var coverHtml = album.cover ? `<img src="${album.cover}" alt="${album.name}" onerror="this.style.display='none'" />` : '';
                        header.innerHTML = `
                            ${coverHtml}
                            <div class="info">
                                <div class="name">${album.name}</div>
                                <div class="count">${album.songs ? album.songs.length : 0} песен${album.year ? ' · ' + album.year : ''}</div>
                            </div>
                        `;
                        groupDiv.appendChild(header);

                        // Список песен
                        var list = document.createElement('div');
                        list.className = 'songs-list';
                        if (album.songs) {
                            album.songs.forEach(function(song) {
                                var item = document.createElement('div');
                                item.className = 'song-item';
                                item.innerHTML = `
                                    <div class="info">
                                        <div class="title">${song.title}</div>
                                        ${song.description ? `<div class="desc">${song.description}</div>` : ''}
                                    </div>
                                    <button class="play-btn" data-song='${JSON.stringify(song)}'>▶️</button>
                                `;
                                var btn = item.querySelector('.play-btn');
                                btn.addEventListener('click', function(e) {
                                    e.stopPropagation();
                                    var s = JSON.parse(this.dataset.song);
                                    // Проверяем, есть ли файл
                                    if (!s.file) {
                                        alert('Файл не найден: ' + s.title);
                                        return;
                                    }
                                    openPlayer(s);
                                    // Обновляем кнопки
                                    document.querySelectorAll('.play-btn').forEach(b => {
                                        b.textContent = '▶️';
                                        b.classList.remove('playing');
                                    });
                                    this.textContent = '⏸️';
                                    this.classList.add('playing');
                                });
                                // Двойной клик по строке — тоже воспроизведение
                                item.addEventListener('dblclick', function() {
                                    btn.click();
                                });
                                list.appendChild(item);
                            });
                        }
                        groupDiv.appendChild(list);
                        container.appendChild(groupDiv);
                    });
                })
                .catch(error => {
                    console.error('Ошибка загрузки музыки:', error);
                    container.innerHTML = '<div class="empty-message">⚠️ Не удалось загрузить музыку. Проверьте файл music.json.</div>';
                });
        }

        // ====================================================
        // 4. ВОССТАНОВЛЕНИЕ ПЛЕЕРА ПОСЛЕ ПЕРЕЗАГРУЗКИ
        // ====================================================
        function restorePlayer() {
            try {
                var saved = localStorage.getItem('oplot_player');
                if (saved) {
                    var data = JSON.parse(saved);
                    if (data.song && data.song.file) {
                        // Проверяем, существует ли файл
                        fetch(data.song.file, { method: 'HEAD' })
                            .then(res => {
                                if (res.ok) {
                                    openPlayer(data.song);
                                    fp.audio.currentTime = data.time || 0;
                                    if (data.time > 0) {
                                        fp.now.textContent = '▶ ' + data.song.title + ' (продолжение)';
                                    }
                                }
                            })
                            .catch(() => {});
                    }
                }
            } catch(e) {}
        }

        // ====================================================
        // 5. ЗАПУСК
        // ====================================================
        window.onload = function() {
            setTimeout(loadMusic, 300);
            setTimeout(restorePlayer, 800);
        };
    </script>
</body>
</html>

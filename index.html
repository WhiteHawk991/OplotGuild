<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ОПЛОТ — Гильдия WOSB</title>
    <base href="/OplotGuild/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .main-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Текст теперь по центру, но мы добавим отступ сверху */
            align-items: center;
            text-align: center;
            color: #e0d6b0;
            padding: 60px 20px 80px 20px; /* Сместили контент вниз, освободив верх */
            border-radius: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('images/OplotImageHome.png') center/cover no-repeat;
            background-size: cover;
            background-position: center 20%;
            width: 100%;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        
        /* ===== ПЛАВАЮЩИЙ КОРАБЛИК ===== */
        .floating-ship {
            position: absolute;
            bottom: 40px;
            left: -150px; /* Начинаем за экраном */
            font-size: 4rem;
            z-index: 3;
            animation: sail 18s linear infinite;
            opacity: 0.7;
            filter: drop-shadow(0 4px 15px rgba(201, 168, 76, 0.4));
            pointer-events: none;
        }
        @keyframes sail {
            0% { transform: translateX(0) scaleX(1); }
            49% { transform: translateX(calc(100vw + 200px)) scaleX(1); }
            50% { transform: translateX(calc(100vw + 200px)) scaleX(-1); }
            99% { transform: translateX(0) scaleX(-1); }
            100% { transform: translateX(0) scaleX(1); }
        }
        /* Делаем его меньше на телефонах */
        @media (max-width: 600px) {
            .floating-ship {
                font-size: 2.5rem;
                bottom: 20px;
                animation-duration: 12s;
            }
        }

        .main-page > * { position: relative; z-index: 2; }
        .main-page h2 {
            font-size: 3rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            margin-bottom: 20px;
            color: #c9a84c;
            letter-spacing: 2px;
        }
        .main-page .description {
            max-width: 700px;
            font-size: 1.2rem;
            line-height: 1.8;
            background: rgba(0,0,0,0.45);
            padding: 30px 40px;
            border-radius: 15px;
            border: 1px solid rgba(201, 168, 76, 0.25);
            backdrop-filter: blur(2px);
            margin-bottom: 20px;
        }
        .main-page .description strong { color: #c9a84c; }
        .main-page .description .quote {
            font-style: italic;
            color: #c9a84c;
            margin-top: 15px;
        }
        .btn-gold {
            margin-top: 10px;
            padding: 15px 45px;
            background: #c9a84c;
            color: #1a1a2e;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            transition: all 0.3s;
            border: 2px solid #e0d6b0;
            display: inline-block;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(201, 168, 76, 0.3);
        }
        .btn-gold:hover {
            background: #e0d6b0;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(201, 168, 76, 0.4);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
            width: 100%;
            max-width: 450px;
        }
        .stat-item {
            background: rgba(0,0,0,0.5);
            padding: 15px 10px;
            border-radius: 10px;
            border: 1px solid rgba(201, 168, 76, 0.25);
            backdrop-filter: blur(2px);
            transition: 0.3s;
        }
        .stat-item:hover {
            background: rgba(201, 168, 76, 0.15);
            transform: translateY(-2px);
        }
        .stat-item .number {
            font-size: 2rem;
            font-weight: bold;
            color: #c9a84c;
        }
        .stat-item .label {
            font-size: 0.85rem;
            color: #b8a88a;
        }
        @media (max-width: 600px) {
            .main-page { padding: 40px 15px 60px 15px; }
            .main-page h2 { font-size: 2.2rem; }
            .main-page .description { padding: 20px; font-size: 1rem; }
            .btn-gold { padding: 12px 30px; font-size: 1rem; }
            .stats-grid { gap: 10px; max-width: 100%; }
            .stat-item .number { font-size: 1.5rem; }
            .stat-item .label { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>

    <div class="main-page">
        <h2>Стоим насмерть</h2>
        <div class="description">
            <p><strong>ОПЛОТ</strong> — это гильдия ветеранов WOSB, где честь и братство важнее рейтинга.</p>
            <p>Мы сражаемся как единый механизм, прикрываем спины друг друга и не бросаем своих в бою.</p>
            <p class="quote">«Победа — это когда все вернулись домой».</p>
        </div>
        
        <a href="/OplotGuild/rules.html" class="btn-gold">⚔️ Вступить в ряды</a>

        <div class="stats-grid" id="stats-container">
            <div class="stat-item">
                <div class="number" id="stat-builds">⏳</div>
                <div class="label">Билдов</div>
            </div>
            <div class="stat-item">
                <div class="number" id="stat-events">⏳</div>
                <div class="label">Событий</div>
            </div>
            <div class="stat-item">
                <div class="number" id="stat-members">⏳</div>
                <div class="label">Участников</div>
            </div>
        </div>

        <!-- ПЛАВАЮЩИЙ КОРАБЛИК -->
        <div class="floating-ship">⛵</div>
    </div>

    <script src="menu.js"></script>
    <script>
        function loadStats() {
            fetch('builds.json?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    document.getElementById('stat-builds').textContent = data.builds ? data.builds.length : 0;
                })
                .catch(() => document.getElementById('stat-builds').textContent = '0');

            fetch('events.json?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    document.getElementById('stat-events').textContent = data.events ? data.events.length : 0;
                })
                .catch(() => document.getElementById('stat-events').textContent = '0');

            document.getElementById('stat-members').textContent = '28';
        }

        window.onload = function() {
            setTimeout(loadStats, 500);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ОПЛОТ — Гильдия WOSB</title>
    <base href="/OplotGuild/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <!-- Здесь будет ваше приложение -->
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- ВРЕМЕННАЯ КНОПКА ДЛЯ ПРОВЕРКИ -->
    <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999;">
        <a href="/OplotGuild/rules" class="btn" style="
            padding: 15px 40px;
            background: #c9a84c;
            color: #1a1a2e;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2rem;
            border: 2px solid #e0d6b0;
            display: inline-block;
        ">
            ⚔️ Вступить в ряды (временная)
        </a>
    </div>

    <script>
        // Восстанавливаем путь после перенаправления через 404.html
        (function() {
            var redirect = sessionStorage.getItem('redirect');
            if (redirect && redirect !== '' && redirect !== '/') {
                sessionStorage.removeItem('redirect');
                history.replaceState(null, '', redirect);
            }
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>

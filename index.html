<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ОПЛОТ — Гильдия WOSB</title>
    <base href="/OplotGuild/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div class="main-page" style="
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('images/OplotImageHome.png') center/contain no-repeat;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #e0d6b0;
            padding: 40px 20px;
            border-radius: 10px;
        ">
            <h2 style="font-size: 2rem; text-shadow: 2px 2px 6px rgba(0,0,0,0.9); margin-bottom: 30px; color: #c9a84c;">
                Стоим насмерть
            </h2>
            <div style="max-width: 700px; font-size: 1.2rem; line-height: 1.8; background: rgba(0,0,0,0.6); padding: 30px; border-radius: 15px; border: 1px solid #c9a84c;">
                <p>
                    <strong>ОПЛОТ</strong> — это гильдия ветеранов WOSB, где честь и братство важнее рейтинга.
                </p>
                <p>
                    Мы сражаемся как единый механизм, прикрываем спины друг друга и не бросаем своих в бою.
                </p>
                <p style="font-style: italic; color: #c9a84c; margin-top: 15px;">
                    «Победа — это когда все вернулись домой».
                </p>
            </div>
            
            <a href="rules.html"  class="btn" style="
                margin-top: 30px;
                padding: 15px 40px;
                background: #c9a84c;
                color: #1a1a2e;
                font-weight: bold;
                text-decoration: none;
                border-radius: 30px;
                font-size: 1.2rem;
                border: 2px solid #e0d6b0;
                display: inline-block;
            ">
                ⚔️ Вступить в ряды
            </a>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // Восстанавливаем путь после перенаправления через 404.html
        (function() {
            var redirect = sessionStorage.getItem('redirect');
            if (redirect && redirect !== '' && redirect !== '/') {
                sessionStorage.removeItem('redirect');
                history.replaceState(null, '', redirect);
            }
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
